# Daily: finds official English-friendly trailers and updates trailers.json (see trailers/README.md).
name: Trailers

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Rescan every channel's whole history (about 2,500 quota units)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trailers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Matching tests
        run: python3 trailers/update.py --self-test
      - name: Update trailers
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 trailers/update.py ${{ inputs.full && '--full' || '' }}
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trailers.json trailers/state.json trailers/stats.json trailers/report.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Trailers: $(date -u +%Y-%m-%d) update"
            git push
          fi
